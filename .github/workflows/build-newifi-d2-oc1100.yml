name: Build Newifi D2 OC1100

on:
  workflow_dispatch:
    inputs:
      cpu_mhz:
        description: 'CPU 频率'
        required: true
        default: '1100'
        type: choice
        options:
          - '1100'
          - '1000'
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  OPENWRT_TAG: v25.12.6

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CPU_MHZ: ${{ inputs.cpu_mhz || '1100' }}

    steps:
      - name: Checkout build configs
        uses: actions/checkout@v4
        with:
          path: build-repo

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential clang flex bison gawk gcc git \
            libncurses5-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget zstd ccache

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: openwrt/.ccache
          key: ${{ runner.os }}-ccache-newifi-d2-${{ hashFiles('build-repo/config/custom.config', 'build-repo/scripts/*.py', 'build-repo/files/**') }}
          restore-keys: |
            ${{ runner.os }}-ccache-newifi-d2-

      - name: Clone OpenWrt ${{ env.OPENWRT_TAG }}
        run: |
          git clone --depth 1 --branch "${{ env.OPENWRT_TAG }}" \
            https://github.com/openwrt/openwrt.git openwrt

      - name: Install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          # 移除存在 kconfig 递归依赖的 weechat 系列包
          # 报错：luci-app-weechat -> weechat-full -> weechat-minimal -> luci-app-weechat
          find feeds -maxdepth 3 -type d \( -name 'weechat' -o -name 'luci-app-weechat' \) -exec rm -rf {} + 2>/dev/null || true
          ./scripts/feeds install -a

      - name: Compute PLL divider
        run: |
          if [ "${{ env.CPU_MHZ }}" = "1100" ]; then
            echo "FBDIV=54" >> "$GITHUB_ENV"
          else
            echo "FBDIV=49" >> "$GITHUB_ENV"
          fi
          echo "CPU_MHZ=${{ env.CPU_MHZ }}" >> "$GITHUB_ENV"

      - name: Patch DTS (no WiFi / no USB)
        run: |
          python3 build-repo/scripts/patch_dts.py \
            openwrt/target/linux/ramips/dts/mt7621_d-team_newifi-d2.dts

      - name: Install custom files
        run: |
          mkdir -p openwrt/files/etc/uci-defaults
          cp build-repo/files/etc/uci-defaults/99-custom \
             openwrt/files/etc/uci-defaults/99-custom
          chmod +x openwrt/files/etc/uci-defaults/99-custom

      # 关键点：必须先生成 .config，否则 target/linux/prepare 会触发交互式 menuconfig
      - name: Generate .config
        run: |
          cd openwrt
          make defconfig
          bash ../build-repo/config/apply.sh
          echo "----- selected target -----"
          grep '^CONFIG_TARGET_ramips' .config | head -n 10
          echo "----- selected packages -----"
          grep -E '^CONFIG_PACKAGE_(luci|mwan3|firewall4|kmod-nft-offload|ppp)' .config | head -n 30

      - name: Patch kernel clock (${{ env.CPU_MHZ }} MHz)
        run: |
          make -C openwrt -j"$(nproc)" target/linux/prepare
          CLK=$(find openwrt/build_dir -path '*/linux-ramips_mt7621/linux-*/drivers/clk/ralink/clk-mt7621.c' | head -n1)
          if [ -z "$CLK" ]; then
            echo "clk-mt7621.c not found" >&2
            exit 1
          fi
          echo "patching: $CLK"
          python3 build-repo/scripts/patch_clk.py "$CLK" "${{ env.FBDIV }}"
          grep -q 'mt7621_cpu_oc' "$CLK" || { echo "clock patch verification failed" >&2; exit 1; }

      - name: Build firmware
        run: |
          make -C openwrt -j"$(nproc)" download
          make -C openwrt -j"$(nproc)"

      - name: Verify image
        id: verify
        run: |
          IMG=$(find openwrt/bin/targets/ramips/mt7621 -name '*newifi-d2*squashfs-sysupgrade.bin' | head -n1)
          if [ -z "$IMG" ]; then
            echo "sysupgrade image not found" >&2
            exit 1
          fi
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          ls -lh "$IMG"
          sha256sum "$IMG"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: newifi-d2-oc${{ env.CPU_MHZ }}-${{ env.OPENWRT_TAG }}
          path: ${{ steps.verify.outputs.image }}
          if-no-files-found: error
          retention-days: 30
